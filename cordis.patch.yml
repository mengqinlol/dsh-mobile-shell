# dsh-mobile-shell bundle patch.
#
# Mounts one code row. The plugin registers an index tap on the webserver that
# injects the mobile shell layer (polyfill + stylesheet + script) into every
# served index.html. It deliberately patches NOTHING else: the bind address
# stays owned by the web-app row, which reads it from the app flags.
- insert:
    - id: mobile-shell
      name: 'dsh-mobile-shell'
      inject: [webServer]
